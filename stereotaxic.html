<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>脑立体定位斜插坐标计算器 - 3D可视化</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* 控制面板 - 悬浮在左上角 */
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            color: white;
            width: 320px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: auto;
            font-size: 14px;
        }
        .controls h2 {
            margin: 0 0 5px 0;
            font-size: 1.4rem;
            text-align: center;
        }
        .controls .sub {
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group label {
            width: 100px;
            font-weight: 500;
        }
        .input-group input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: none;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus {
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 0 2px #4c9aff;
        }
        .dir-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            padding-left: 10px;
        }
        .dir-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dir-item select {
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4c9aff;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a7fdc;
        }
        .result {
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            border-left: 3px solid #4c9aff;
        }
        .result p {
            margin: 5px 0;
        }
        .note {
            font-size: 11px;
            text-align: center;
            opacity: 0.6;
            margin-top: 15px;
        }
        @media (max-width: 700px) {
            .controls { width: 280px; padding: 12px; top: 10px; left: 10px; }
            .input-group label { width: 70px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <h2>🧠 脑立体定位斜插计算器</h2>
        <div class="sub">XZ / XY 双平面倾斜 | 3D实时预览</div>
        
        <div class="input-group">
            <label>原始X (mm):</label>
            <input type="number" id="origX" value="0.70" step="0.01">
        </div>
        <div class="input-group">
            <label>原始Y (mm):</label>
            <input type="number" id="origY" value="-1.05" step="0.01">
        </div>
        <div class="input-group">
            <label>原始Z (mm):</label>
            <input type="number" id="origZ" value="4.65" step="0.01">
        </div>
        <div class="input-group">
            <label>XZ偏转角度 (°):</label>
            <input type="number" id="angleXZ" value="40" step="1">
        </div>
        <div class="input-group">
            <label>XY偏转角度 (°):</label>
            <input type="number" id="angleXY" value="15" step="1">
        </div>
        
        <div class="dir-group">
            <div class="dir-item">
                <span>XZ方向:</span>
                <select id="dirXZ">
                    <option value="+">向 +X 方向倾斜</option>
                    <option value="-">向 -X 方向倾斜</option>
                </select>
            </div>
            <div class="dir-item">
                <span>XY方向:</span>
                <select id="dirXY">
                    <option value="+">向 +Y 方向倾斜</option>
                    <option value="-">向 -Y 方向倾斜</option>
                </select>
            </div>
        </div>
        
        <button id="calcBtn">📐 计算坐标 & 更新3D图</button>
        
        <div class="result" id="resultArea">
            <p>✨ 点击计算显示结果</p>
        </div>
        <div class="note">💡 鼠标拖拽旋转视角 | 右键拖拽平移 | 滚动缩放</div>
    </div>

    <!-- 引入 Three.js 核心库以及扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008); // 轻微雾效增强景深

        // 透视相机 (视角, 宽高比, 近平面, 远平面)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 10);
        camera.lookAt(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 开启阴影
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2渲染文字标签
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;      // 惯性
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        
        // --- 辅助元素: 网格地板 (颅骨平面示意) ---
        const gridHelper = new THREE.GridHelper(20, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = 0;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.4;
        scene.add(gridHelper);
        
        // 一个半透明平面表示颅骨表面 (Z=0平面)
        const planeMat = new THREE.MeshPhongMaterial({ color: 0x2c3e66, side: THREE.DoubleSide, transparent: true, opacity: 0.25, depthWrite: false });
        const basePlane = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), planeMat);
        basePlane.rotation.x = -Math.PI / 2;
        basePlane.position.y = 0;
        scene.add(basePlane);
        
        // 简易坐标轴 (X:红, Y:绿, Z:蓝)
        const axesHelper = new THREE.AxesHelper(6);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.2;
        scene.add(axesHelper);
        
        // 添加环境光和方向光让物体有立体感
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(2, 5, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.3);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        
        // 存储动态物体，以便更新时清除
        let dynamicGroup = null;
        
        // 辅助创建CSS2D文本
        function makeLabel(text, color, position) {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = '16px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0px black';
            div.style.background = 'rgba(0,0,0,0.6)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '20px';
            div.style.borderLeft = `3px solid ${color}`;
            div.style.fontFamily = 'monospace';
            const label = new CSS2DObject(div);
            label.position.copy(position);
            return label;
        }
        
        // 核心计算与场景更新
        function updateScene() {
            // 获取输入值
            const xTar = parseFloat(document.getElementById('origX').value);
            const yTar = parseFloat(document.getElementById('origY').value);
            const zTar = parseFloat(document.getElementById('origZ').value);
            const angleXZ = parseFloat(document.getElementById('angleXZ').value);
            const angleXY = parseFloat(document.getElementById('angleXY').value);
            const dirXZ = document.getElementById('dirXZ').value === '+' ? 1 : -1;
            const dirXY = document.getElementById('dirXY').value === '+' ? 1 : -1;
            
            // 计算弧度
            const radXZ = angleXZ * Math.PI / 180;
            const radXY = angleXY * Math.PI / 180;
            
            // 斜插深度
            const depthSlant = zTar / Math.cos(radXZ);
            // 偏移量
            const deltaX = zTar * Math.tan(radXZ);
            const deltaY = zTar * Math.tan(radXY);
            
            // 入针点坐标
            const xEntry = xTar - dirXZ * deltaX;
            const yEntry = yTar - dirXY * deltaY;
            
            // 更新结果面板
            const resultDiv = document.getElementById('resultArea');
            resultDiv.innerHTML = `
                <p>🎯 <strong>斜插入针点</strong> &nbsp; (X, Y, Z=0)</p>
                <p>X_entry = ${xEntry.toFixed(3)} mm &nbsp;&nbsp; Y_entry = ${yEntry.toFixed(3)} mm</p>
                <p>📏 <strong>斜插深度</strong> &nbsp; Depth = ${depthSlant.toFixed(3)} mm</p>
                <p>📐 偏移量: ΔX = ${deltaX.toFixed(3)} mm &nbsp; | &nbsp; ΔY = ${deltaY.toFixed(3)} mm</p>
                <p>🎯 靶点: (${xTar.toFixed(2)}, ${yTar.toFixed(2)}, ${zTar.toFixed(2)})</p>
            `;
            
            // --- 更新3D场景 ---
            if (dynamicGroup) scene.remove(dynamicGroup);
            dynamicGroup = new THREE.Group();
            
            // 1. 靶点 (红色球体 + 光环)
            const targetGeo = new THREE.SphereGeometry(0.18, 32, 32);
            const targetMat = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0x441122, roughness: 0.3, metalness: 0.1 });
            const targetSphere = new THREE.Mesh(targetGeo, targetMat);
            targetSphere.position.set(xTar, yTar, zTar);
            dynamicGroup.add(targetSphere);
            // 靶点外圈发光环
            const ringGeo = new THREE.SphereGeometry(0.28, 16, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff6699, transparent: true, opacity: 0.25, side: THREE.BackSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.set(xTar, yTar, zTar);
            dynamicGroup.add(ring);
            
            // 靶点标签
            const targetLabel = makeLabel(`靶点 (${xTar.toFixed(2)}, ${yTar.toFixed(2)}, ${zTar.toFixed(2)})`, '#ff8888', new THREE.Vector3(xTar, yTar, zTar + 0.25));
            dynamicGroup.add(targetLabel);
            
            // 2. 入针点 (蓝色球体)
            const entryGeo = new THREE.SphereGeometry(0.16, 32, 32);
            const entryMat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x004466 });
            const entrySphere = new THREE.Mesh(entryGeo, entryMat);
            entrySphere.position.set(xEntry, yEntry, 0);
            dynamicGroup.add(entrySphere);
            const entryLabel = makeLabel(`入针点 (${xEntry.toFixed(2)}, ${yEntry.toFixed(2)}, 0)`, '#88ccff', new THREE.Vector3(xEntry, yEntry, 0.25));
            dynamicGroup.add(entryLabel);
            
            // 3. 针道: 红色圆柱体 (从入针点到靶点)
            const start = new THREE.Vector3(xEntry, yEntry, 0);
            const end = new THREE.Vector3(xTar, yTar, zTar);
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            
            const cylinderGeo = new THREE.CylinderGeometry(0.05, 0.05, length, 6);
            const cylinderMat = new THREE.MeshStandardMaterial({ color: 0xff6666, emissive: 0x441111 });
            const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
            // 计算中点并旋转
            const center = start.clone().add(end).multiplyScalar(0.5);
            cylinder.position.copy(center);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.clone().normalize());
            dynamicGroup.add(cylinder);
            
            // 针道辅助虚线 (装饰)
            const dashPoints = [];
            for (let t = 0; t <= 1; t += 0.05) {
                const point = start.clone().lerp(end, t);
                dashPoints.push(point);
            }
            const lineGeo = new THREE.BufferGeometry().setFromPoints(dashPoints);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xff8888 });
            const dashLine = new THREE.Line(lineGeo, lineMat);
            dynamicGroup.add(dashLine);
            
            // 4. 垂直投影虚线 (从入针点到靶点的垂直投影示意)
            const projStart = new THREE.Vector3(xEntry, yEntry, 0);
            const projEnd = new THREE.Vector3(xEntry, yEntry, zTar);
            const projPoints = [projStart, projEnd];
            const projGeo = new THREE.BufferGeometry().setFromPoints(projPoints);
            const projMat = new THREE.LineBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.5 });
            const projLine = new THREE.Line(projGeo, projMat);
            dynamicGroup.add(projLine);
            
            // 添加连接入针点与靶点的水平辅助线 (绿色虚线风格，只做示意)
            const horizStart = new THREE.Vector3(xEntry, yEntry, 0);
            const horizEnd = new THREE.Vector3(xTar, yTar, 0);
            const horizPoints = [horizStart, horizEnd];
            const horizGeo = new THREE.BufferGeometry().setFromPoints(horizPoints);
            const horizMat = new THREE.LineBasicMaterial({ color: 0x66cc99, transparent: true, opacity: 0.45 });
            const horizLine = new THREE.Line(horizGeo, horizMat);
            dynamicGroup.add(horizLine);
            
            scene.add(dynamicGroup);
        }
        
        // 绑定计算按钮事件
        document.getElementById('calcBtn').addEventListener('click', () => {
            updateScene();
        });
        
        // 窗口适配
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // 初始执行一次
        updateScene();
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // 更新轨道控制
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        // 小优化: 输入框按回车也可以触发
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(el => {
            el.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') updateScene();
            });
        });
    </script>
</body>
</html>
